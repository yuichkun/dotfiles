<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>coverage report</title>
<link rel="stylesheet" href="hub.css">
</head>
<body>
<!-- テンプレートは編集禁止。表示内容の更新は hub-data.js だけで行う（references/progress-hub.md） -->
<main>
  <a class="backlink" href="index.html">← 進行ハブへ戻る</a>
  <h1>調査の coverage report</h1>
  <p class="updated" id="hub-updated"></p>
  <div id="hub-errors"></div>

  <h2>読解ステータス</h2>
  <div class="stats" id="stats"></div>

  <h2>分かった骨子</h2>
  <div class="card"><ul class="plain" id="digest"></ul></div>

  <h2>読めなかったソース</h2>
  <table id="inaccessible-table">
    <thead><tr><th>ソース</th><th>URL</th><th>試した手段</th></tr></thead>
    <tbody id="inaccessible"></tbody>
  </table>

  <footer class="hub-footer">この画面は表示専用。質問・指摘はチャットで。</footer>
</main>
<script src="hub-data.js"></script>
<script>
(function () {
  var errors = [];
  var D = window.HUB_DATA;
  if (!D) { errors.push("hub-data.js が読み込めない"); D = {}; }
  var C = D.coverage;
  document.getElementById("hub-updated").textContent = D.updatedAt ? "更新: " + D.updatedAt : "";

  function stat(label, num) {
    var el = document.createElement("div");
    el.className = "stat";
    var n = document.createElement("span");
    n.className = "num"; n.textContent = String(num);
    var l = document.createElement("span");
    l.className = "label"; l.textContent = label;
    el.appendChild(n); el.appendChild(l);
    document.getElementById("stats").appendChild(el);
  }

  if (!C) {
    errors.push("coverage がない（全件読解が終わってから、この画面を本人に見せる）");
  } else {
    stat("母集団", C.total);
    stat("read", C.read);
    stat("inaccessible", (C.inaccessible || []).length);
    stat("duplicate", C.duplicate || 0);
    stat("irrelevant", C.irrelevant || 0);
    var sum = (C.read || 0) + (C.inaccessible || []).length + (C.duplicate || 0) + (C.irrelevant || 0);
    if (sum !== C.total) {
      errors.push("ステータスの合計 " + sum + " が母集団 " + C.total + " と一致しない（全件にステータスが付いていない）");
    }
    var digest = document.getElementById("digest");
    if (Array.isArray(C.digest) && C.digest.length) {
      C.digest.forEach(function (d) {
        var el = document.createElement("li");
        el.textContent = d;
        digest.appendChild(el);
      });
    } else { errors.push("coverage.digest がない（数字だけ並べて終わらない）"); }
    var tbody = document.getElementById("inaccessible");
    (C.inaccessible || []).forEach(function (row) {
      var tr = document.createElement("tr");
      [row.title, row.url, row.tried].forEach(function (v, i) {
        var td = document.createElement("td");
        if (i === 1 && v) {
          var a = document.createElement("a");
          a.href = v; a.textContent = v;
          td.appendChild(a);
        } else { td.textContent = v || ""; }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    if (!(C.inaccessible || []).length) {
      var tr = document.createElement("tr");
      var td = document.createElement("td");
      td.colSpan = 3; td.textContent = "なし（全件読めた）";
      tr.appendChild(td); tbody.appendChild(tr);
    }
  }

  if (errors.length) {
    var b = document.createElement("div");
    b.className = "banner-error";
    b.textContent = "hub-data.js の不備（本人に見せる前に直すこと）:\n- " + errors.join("\n- ");
    document.getElementById("hub-errors").appendChild(b);
  }
})();
</script>
</body>
</html>
